<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Typing roles animation">
  <defs>
    <style>
      .line {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 22px;
        fill: #5eead4;
      }
      .prompt { fill: #38bdf8; }
      .cursor {
        fill: #f8fafc;
        animation: blink 0.9s step-end infinite;
      }
      .l1 { animation: type1 12s steps(42) infinite; }
      .l2 { animation: type2 12s steps(48) infinite; }
      .l3 { animation: type3 12s steps(40) infinite; }
      .clip1 { animation: reveal1 12s infinite; }
      .clip2 { animation: reveal2 12s infinite; }
      .clip3 { animation: reveal3 12s infinite; }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes reveal1 {
        0%, 3% { width: 0; opacity: 1; }
        22% { width: 720px; opacity: 1; }
        28%, 100% { width: 720px; opacity: 0; }
      }
      @keyframes reveal2 {
        0%, 30% { width: 0; opacity: 0; }
        33% { width: 0; opacity: 1; }
        55% { width: 780px; opacity: 1; }
        61%, 100% { width: 780px; opacity: 0; }
      }
      @keyframes reveal3 {
        0%, 63% { width: 0; opacity: 0; }
        66% { width: 0; opacity: 1; }
        88% { width: 700px; opacity: 1; }
        94%, 100% { width: 700px; opacity: 0; }
      }
    </style>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="900" height="120" rx="18" fill="url(#card)" stroke="#334155" stroke-opacity="0.8"/>
  <circle cx="28" cy="28" r="6" fill="#fb7185"/>
  <circle cx="48" cy="28" r="6" fill="#fbbf24"/>
  <circle cx="68" cy="28" r="6" fill="#34d399"/>
  <text x="92" y="33" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">whoami  live</text>

  <g transform="translate(28, 68)">
    <text class="line">
      <tspan class="prompt">$</tspan>
      <tspan dx="10">Building SaaS platforms end-to-end</tspan>
      <tspan class="cursor" dx="4">|</tspan>
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.30;0.33;0.96;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(28, 68)">
    <text class="line">
      <tspan class="prompt">$</tspan>
      <tspan dx="10">Shipping React · Next.js · Node.js products</tspan>
      <tspan class="cursor" dx="4">|</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.61;0.63;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(28, 68)">
    <text class="line">
      <tspan class="prompt">$</tspan>
      <tspan dx="10">Open to full-time &amp; contract roles</tspan>
      <tspan class="cursor" dx="4">|</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.94;0.96;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
