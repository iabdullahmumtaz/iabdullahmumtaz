<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Abdullah Mumtaz  Senior Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="45%" stop-color="#e8f1f6"/>
      <stop offset="100%" stop-color="#dfeaf2"/>
    </linearGradient>
    <linearGradient id="mesh1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="48" y="48" width="1104" height="324" rx="28"/>
    </clipPath>
    <style>
      .grid { opacity: 0.22; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .float1 { animation: float1 8s ease-in-out infinite; }
      .float2 { animation: float2 10s ease-in-out infinite; }
      .shimmer { animation: shimmer 4.5s linear infinite; }
      .fadeIn { animation: fadeIn 1.1s ease-out both; }
      .fadeInDelay { animation: fadeIn 1.1s ease-out 0.25s both; }
      .fadeInDelay2 { animation: fadeIn 1.1s ease-out 0.45s both; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(18px, -14px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-22px, 12px); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 420; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#mesh1)"/>

  <circle class="float1 pulse" cx="180" cy="90" r="120" fill="url(#orb1)"/>
  <circle class="float2 pulse" cx="1040" cy="320" r="150" fill="url(#orb2)"/>
  <circle class="float1" cx="980" cy="80" r="70" fill="#6366f1" opacity="0.1"/>

  <g class="grid" stroke="#94a3b8" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200"/>
    <path d="M80 0 V420 M160 0 V420 M240 0 V420 M320 0 V420 M400 0 V420 M480 0 V420 M560 0 V420 M640 0 V420 M720 0 V420 M800 0 V420 M880 0 V420 M960 0 V420 M1040 0 V420 M1120 0 V420"/>
  </g>

  <rect x="48" y="48" width="1104" height="324" rx="28" fill="#ffffff" fill-opacity="0.72" stroke="url(#glassStroke)" stroke-width="1.5"/>
  <rect x="48" y="48" width="1104" height="324" rx="28" fill="url(#mesh1)" fill-opacity="0.25"/>
  <rect class="shimmer" x="48" y="48" width="1104" height="324" rx="28" fill="none" stroke="#0d9488" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="80 340"/>

  <g clip-path="url(#cardClip)">
    <rect x="48" y="48" width="1104" height="70" fill="#0f172a" fill-opacity="0.03"/>
  </g>

  <circle cx="88" cy="82" r="7" fill="#fb7185"/>
  <circle cx="112" cy="82" r="7" fill="#fbbf24"/>
  <circle cx="136" cy="82" r="7" fill="#34d399"/>
  <text x="168" y="87" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">abdullah@dev  portfolio.sh</text>

  <g class="fadeIn">
    <text x="88" y="155" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">~/github/iabdullahmumtaz</text>
    <text x="88" y="210" fill="url(#titleGrad)" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="54" font-weight="700">Abdullah Mumtaz</text>
  </g>

  <g class="fadeInDelay">
    <text x="88" y="258" fill="#334155" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">Senior Full Stack Developer</text>
    <text x="88" y="298" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">TypeScript · MERN · SaaS · AWS · Next.js</text>
  </g>

  <g class="fadeInDelay2">
    <rect x="88" y="320" width="148" height="28" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-opacity="0.55"/>
    <text x="162" y="339" text-anchor="middle" fill="#115e59" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">3+ Years</text>

    <rect x="248" y="320" width="148" height="28" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-opacity="0.55"/>
    <text x="322" y="339" text-anchor="middle" fill="#075985" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">30+ Projects</text>

    <rect x="408" y="320" width="168" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-opacity="0.45"/>
    <text x="492" y="339" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Open to Work</text>
  </g>

  <g transform="translate(760, 130)" filter="url(#softGlow)" opacity="0.98">
    <rect x="0" y="0" width="340" height="190" rx="18" fill="#f8fafc" fill-opacity="0.95" stroke="#cbd5e1"/>
    <text x="24" y="36" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">const engineer = {</text>
    <text x="40" y="64" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"><tspan fill="#0284c7">name</tspan>: <tspan fill="#0f766e">"Abdullah"</tspan>,</text>
    <text x="40" y="92" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"><tspan fill="#0284c7">role</tspan>: <tspan fill="#0f766e">"Full Stack"</tspan>,</text>
    <text x="40" y="120" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"><tspan fill="#0284c7">focus</tspan>: <tspan fill="#b45309">"SaaS + Cloud"</tspan>,</text>
    <text x="40" y="148" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"><tspan fill="#0284c7">shipping</tspan>: <tspan fill="#059669">true</tspan></text>
    <text x="24" y="176" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">};<tspan class="cursor" fill="#0f766e">ˆ</tspan></text>
  </g>
</svg>
