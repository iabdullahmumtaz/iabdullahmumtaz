<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="h-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="50%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="h-spot" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#0ea5e9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="78%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#h-base)"/>
  <rect width="900" height="220" fill="url(#h-spot)"/>

  <!-- faint horizon, not a grid -->
  <line x1="80" y1="198" x2="820" y2="198" stroke="url(#h-rule)" stroke-width="1"/>

  <!-- viewfinder corners -->
  <g fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="square">
    <path d="M24,48 L24,24 L48,24"/>
    <path d="M852,24 L876,24 L876,48"/>
    <path d="M24,172 L24,196 L48,196"/>
    <path d="M852,196 L876,196 L876,172"/>
  </g>

  <rect x="0" y="0" width="900" height="2" fill="url(#h-beam)"/>

  <rect x="292" y="34" width="316" height="28" rx="14" fill="url(#h-glass)" stroke="#2dd4bf" stroke-opacity="0.45"/>
  <text x="450" y="53" fill="#99f6e4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2" text-anchor="middle">FULL STACK ENGINEER</text>

  <text x="450" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="0.5" text-anchor="middle">Abdullah Mumtaz</text>

  <text x="450" y="138" fill="#94a3b8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="1.4" text-anchor="middle">Web  ·  App  ·  Automation  ·  SaaS</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <rect x="238" y="158" width="118" height="26" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="297" y="175" fill="#ccfbf1">React / Next.js</text>

    <rect x="366" y="158" width="98" height="26" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="415" y="175" fill="#ccfbf1">Android</text>

    <rect x="474" y="158" width="118" height="26" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="533" y="175" fill="#ccfbf1">Automation</text>

    <rect x="602" y="158" width="60" height="26" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="632" y="175" fill="#ccfbf1">Cloud</text>
  </g>
</svg>
